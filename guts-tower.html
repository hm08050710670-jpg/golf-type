<script>

const fy=world.floor.top+camera;if(fy<H+22){ctx.fillStyle='#12382a';ctx.fillRect(95,fy+6,230,16);ctx.fillStyle='#b9a36a';ctx.fillRect(95,fy,230,5);ctx.fillStyle='#dccb91';ctx.fillRect(95,fy,230,1.5);ctx.strokeStyle='#b9a36a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(103,fy+21);ctx.lineTo(317,fy+21);ctx.stroke();ctx.fillStyle='#a5b7a4';ctx.font='700 10px -apple-system,BlinkMacSystemFont,sans-serif';ctx.textAlign='center';ctx.fillText('G U T S',W/2,fy+39);}for(const b of world.bodies)if(b.bounds.bottom+camera> -80&&b.bounds.top+camera<H+120)drawLetter(b);if(preview)drawLetter(preview,true);ctx.fillStyle='rgba(236,227,204,.50)';ctx.font='8px -apple-system,BlinkMacSystemFont,sans-serif';ctx.textAlign='right';ctx.fillText('BALANCE IS EVERYTHING',W-17,H-13);}
function frame(now){if(!paused){if(!last)last=now;acc+=Math.min((now-last)/1000,.05);let count=0;while(acc>=1/120&&count<6){step(1/120);acc-=1/120;count++;}draw();}last=now;requestAnimationFrame(frame);}
function tap(e,action){e.preventDefault();action();}
dropBtn.addEventListener('click',e=>tap(e,drop));rotateBtn.addEventListener('click',e=>tap(e,rotate));restartBtn.addEventListener('click',e=>tap(e,reset));canvas.addEventListener('pointerdown',e=>tap(e,drop),{passive:false});root.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();drop();}else if(e.code==='ArrowUp'){e.preventDefault();rotate();}});document.addEventListener('visibilitychange',()=>{paused=document.hidden;last=performance.now();acc=0;});window.addEventListener('resize',resize);reset();resize();requestAnimationFrame(frame);
window.__GUTS_TEST__={state:()=>({score,best,ended,preview:preview?{letter:preview.letter,x:preview.x,y:preview.y,angle:preview.angle}:null,bodies:world.bodies.map(b=>({letter:b.letter,x:b.x,y:b.y,angle:b.angle,stable:b.stable,counted:b.counted})),camera}),drop,reset,rotate,step};
}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();})();

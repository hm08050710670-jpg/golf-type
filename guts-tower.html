(function(){'use strict';function boot(){const root=document.getElementById('guts-fixed');if(!root||root.dataset.booted)return;root.dataset.booted='1';const $=id=>root.querySelector('#'+id),canvas=$('guts-stage'),ctx=canvas.getContext('2d'),dropBtn=$('guts-drop'),rotateBtn=$('guts-rotate'),restartBtn=$('guts-again'),over=$('guts-over'),scoreEl=$('guts-score'),bestEl=$('guts-best'),statusEl=$('guts-status'),nextEl=$('guts-next');if(!ctx||!window.GutsPhysics){statusEl.textContent='ゲームを起動できませんでした。公開ページをブラウザーで開いてください。';dropBtn.disabled=true;return;}$('guts-boot-note').hidden=true;

try{best=Math.max(0,parseInt(localStorage.getItem('guts-tower-best-v4'),10)||0);}catch(_){}bestEl.textContent=String(best);const randomLetter=()=> 'GUTS'[Math.floor(Math.random()*4)];

function pathLine(points){ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);}

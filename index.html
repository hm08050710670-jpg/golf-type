<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOLF TYPE 診断</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0c1712; color: #fff; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 22px;
  }
  .app { width: 100%; max-width: 520px; }
  .brand { letter-spacing: .18em; font-size: 12px; opacity: .7; margin-bottom: 14px; text-align:center; }
  .card {
    background: #14231b; border: 1px solid #2a3b31; border-radius: 24px;
    padding: 28px 22px; box-shadow: 0 18px 50px rgba(0,0,0,.25);
  }
  h1 { font-size: 30px; margin: 0 0 10px; text-align:center; }
  .lead { color:#b9c5be; line-height:1.7; text-align:center; margin-bottom:26px; }
  button {
    width:100%; border:0; border-radius:14px; padding:16px; margin-top:12px;
    font-size:16px; font-weight:700; cursor:pointer;
  }
  .primary { background:#fff; color:#102018; }
  .answer { background:#21372b; color:#fff; border:1px solid #365142; text-align:left; }
  .answer:hover { background:#2b4637; }
  .progress { height:6px; background:#26372e; border-radius:10px; overflow:hidden; margin-bottom:24px; }
  .bar { height:100%; background:#fff; transition:.25s; }
  .qnum { font-size:13px; color:#aab9b0; margin-bottom:10px; }
  .question { font-size:23px; line-height:1.45; margin-bottom:20px; font-weight:750; }
  .type { font-size:13px; letter-spacing:.12em; color:#aab9b0; text-align:center; }
  .result-title { font-size:32px; text-align:center; margin:8px 0 18px; }
  .result-box { background:#1b3025; padding:18px; border-radius:16px; line-height:1.7; color:#dbe4de; }
  .small { font-size:12px; color:#829188; text-align:center; margin-top:18px; line-height:1.5; }
</style>
</head>
<body>
<div class="app">
  <div class="brand">GOLF GUTS / PROTOTYPE</div>
  <div class="card" id="card"></div>
</div>

<script>
const questions = [
  { q:"残り200ヤード。グリーンを狙える状況なら？",
    a:["積極的にグリーンを狙う","まず大きなミスを避ける"], axis:"play" },
  { q:"スイングを直すとき、理解しやすいのは？",
    a:["まず感覚やイメージで掴む","映像や数値、理屈から理解する"], axis:"learn" },
  { q:"ラウンド中に大きなミスが出たら？",
    a:["すぐ切り替えて次の一打へ","原因を考えて次のショットを調整"], axis:"mind" },
  { q:"練習で上達を感じやすいのは？",
    a:["同じ動きを繰り返して身体に覚えさせる","課題を決めて一つずつ解決する"], axis:"practice" }
];

let index = -1;
let score = {play:0, learn:0, mind:0, practice:0};

function start(){
  index=0; score={play:0, learn:0, mind:0, practice:0}; renderQuestion();
}

function renderStart(){
 document.getElementById("card").innerHTML = `
   <h1>GOLF TYPE 診断</h1>
   <p class="lead">4つの質問から、あなたのゴルフの考え方・上達スタイルを簡易診断します。</p>
   <button class="primary" onclick="start()">診断をはじめる</button>
   <div class="small">テスト版 / 全4問・約30秒</div>`;
}

function choose(v){
  score[questions[index].axis] = v;
  index++;
  if(index < questions.length) renderQuestion(); else renderResult();
}

function renderQuestion(){
 const x=questions[index];
 document.getElementById("card").innerHTML = `
   <div class="progress"><div class="bar" style="width:${(index/questions.length)*100}%"></div></div>
   <div class="qnum">QUESTION ${index+1} / ${questions.length}</div>
   <div class="question">${x.q}</div>
   <button class="answer" onclick="choose(0)">A　${x.a[0]}</button>
   <button class="answer" onclick="choose(1)">B　${x.a[1]}</button>`;
}

function renderResult(){
 const attack = score.play===0;
 const sense = score.learn===0;
 const reset = score.mind===0;
 const repeat = score.practice===0;

 let title, desc;
 if(attack && sense){
   title="直感アタッカー";
   desc="チャンスでは積極的に攻め、感覚を活かしてプレーするタイプ。勢いに乗ると強い反面、無理な一打を選びすぎないことがスコア安定のポイントです。";
 } else if(attack && !sense){
   title="戦略アタッカー";
   desc="根拠を持って攻めたいタイプ。データや状況判断を武器に、狙う場面と守る場面を明確にすると強みがさらに活きます。";
 } else if(!attack && sense){
   title="フィーリング安定型";
   desc="大きなミスを避けながら、自分の感覚を大切にプレーするタイプ。得意な球筋とルーティンを固めると安定感を伸ばせます。";
 } else {
   title="分析マネージャー";
   desc="リスクを管理しながら、理論的にゴルフを組み立てるタイプ。分析しすぎて迷わないよう、ショット前の判断をシンプルにすることがポイントです。";
 }

 const sub = `${reset ? "切り替え型" : "分析型"} × ${repeat ? "反復練習型" : "課題解決型"}`;
 document.getElementById("card").innerHTML = `
   <div class="type">YOUR GOLF TYPE</div>
   <div class="result-title">${title}</div>
   <div class="result-box">
     ${desc}<br><br>
     <strong>サブタイプ：</strong>${sub}
   </div>
   <button class="primary" onclick="start()">もう一度診断する</button>
   <div class="small">これはGOLF MBTI構想の動作確認用プロトタイプです。</div>`;
}
renderStart();
</script>
</body>
</html>
